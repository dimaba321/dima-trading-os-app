<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Dima Trading OS — Setup</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0d1117; color:#c9d1d9; font-family:'SF Mono','Fira Code',monospace;
           display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:12px;
            padding:40px; width:440px; }
    h1 { font-size:22px; color:#3fb950; margin-bottom:6px; }
    p  { font-size:12px; color:#8b949e; margin-bottom:28px; line-height:1.6; }
    label { font-size:10px; color:#8b949e; text-transform:uppercase; letter-spacing:.1em;
            display:block; margin-bottom:5px; }
    input { width:100%; background:#1c2128; border:1px solid #30363d; color:#c9d1d9;
            font-family:inherit; font-size:13px; padding:8px 12px; border-radius:6px;
            outline:none; margin-bottom:16px; }
    input:focus { border-color:#3fb950; }
    button { width:100%; background:#238636; color:#fff; border:none; border-radius:6px;
             padding:12px; font-size:14px; font-weight:700; cursor:pointer;
             font-family:inherit; margin-top:8px; }
    button:hover { background:#2ea043; }
    .skip { background:none; color:#8b949e; border:1px solid #30363d;
            font-size:12px; font-weight:400; margin-top:8px; }
    .skip:hover { color:#c9d1d9; }
    .note { font-size:10px; color:#484f58; margin-top:12px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Welcome to Dima Trading OS</h1>
    <p>First-time setup. Enter your details to get started. Account value is managed inside the Dashboard.</p>

    <label>Your Name</label>
    <input type="text" id="username" placeholder="e.g. Dima" autocomplete="off"/>

    <label>Anthropic API Key</label>
    <input type="password" id="apikey" placeholder="sk-ant-api03-..."/>

    <label>Telegram Bot Token (optional)</label>
    <input type="text" id="telegram" placeholder="Leave blank to set up later"/>

    <button onclick="save()">▶ Start Trading OS</button>
    <button class="skip" onclick="skip()">Skip — set up later</button>

    <div class="note">
      Your data stays on this machine only. API keys are stored in the app's local config file.
    </div>
  </div>

  <script>
    function save() {
      const username = document.getElementById('username').value.trim() || 'Trader';
      const apikey   = document.getElementById('apikey').value.trim();
      const telegram = document.getElementById('telegram').value.trim();
      window.location.hash = JSON.stringify({ username, apikey, telegram, setup: true });
    }
    function skip() {
      window.location.hash = JSON.stringify({ setup: true, skipped: true });
    }
  </script>
</body>
</html>
